name: Infracost Diff

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number to scan"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost-diff:
    runs-on: ubuntu-latest
    
    # Визначаємо змінні для всіх кроків у межах цієї джоби
    env:
      GOOGLE_OAUTH_ACCESS_TOKEN: "fake-token-for-infracost-scan"
      CLOUDSDK_AUTH_ACCESS_TOKEN: "fake-token-for-infracost-scan"
      GOOGLE_PROJECT: "fake-project-id"

    steps:
      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -n "$INPUT_PR_NUMBER" ]; then
            BASE_REF=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
            HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          fi
          echo "base-ref=${BASE_REF}" >> $GITHUB_OUTPUT
          echo "head-ref=${HEAD_REF}" >> $GITHUB_OUTPUT
          echo "pr-number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Checkout base branch
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base-ref }}
          path: base

      - name: Checkout head branch
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head-ref }}
          path: head

      - name: Setup Terraform
        if: github.event.action != 'closed'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Infracost
        if: github.event.action != 'closed'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON for Base
        if: github.event.action != 'closed'
        run: |
          cd base
          terraform init -backend=false
          terraform plan -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
          infracost breakdown --path tfplan.json --out-file ../infracost-base.json

      - name: Generate Infracost JSON for Head
        if: github.event.action != 'closed'
        run: |
          cd head
          terraform init -backend=false
          terraform plan -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
          infracost breakdown --path tfplan.json --out-file ../infracost-head.json

      - name: Post Infracost Comment
        if: github.event.action != 'closed'
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          infracost diff --path=infracost-head.json \
                         --compare-to=infracost-base.json \
                         --format=json \
                         --out-file=infracost-diff.json

          infracost comment github --path=infracost-diff.json \
                                   --repo=${{ github.repository }} \
                                   --pull-request=${{ steps.pr.outputs.pr-number }} \
                                   --behavior=update
